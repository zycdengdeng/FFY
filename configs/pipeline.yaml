# pipeline 全局配置
coord_frame: "intertarsal-origin, contra-ankle horizontal"   # 沿用蓝本 AESCTE
keypoints: [hip, knee, ankle, mtp, toe, ankle_contra]
segments: ["femur(L3)", "tibiotarsus(L2)", "tarsometatarsus(L1)"]
# 骨长比先验中心(蓝本): 天鹅 1:2:1, 苍鹭 1:2.31:1.85  → 防物种域外污染 #9
bone_ratio_prior:
  swan:  {r2: 2.0, r3: 1.0}     # L2/L1, L3/L1
  heron: {r2: 2.31, r3: 1.85}
scale: single_global   # 只用比例,不求绝对尺度
